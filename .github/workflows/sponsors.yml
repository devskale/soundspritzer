name: Refresh sponsors

on:
  schedule:
    - cron: "17 * * * *" # stündlich (_minute 17: abseits der GitHub-Spitzenlasten)
  workflow_dispatch: {}   # manuell per Button

permissions:
  contents: write

jobs:
  sponsors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sponsors aus Google Sheet ziehen
        run: node scripts/gen-sponsors.mjs

      - name: Commit & push (nur wenn geändert)
        run: |
          if [[ -n $(git status --porcelain assets/sponsors.json) ]]; then
            git config user.name  "sponsors-bot"
            git config user.email "actions@github.com"
            git add assets/sponsors.json
            git commit -m "sponsors: Sheet-Stand $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "Keine Änderungen — nichts zu committen."
          fi
