<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SunDowner — 25.09.2026 · Am Tabor, Neusiedl am See</title>
  <meta name="description" content="SunDowner am Tabor — Live-Musik & DJ. 25. September 2026, Neusiedl am See.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --dusk-top: #221528;
      --dusk-mid: #4d2334;
      --dusk-low: #8f3d28;
      --horizon: #e08a3c;
      --cream: #f7ead8;
      --cream-soft: rgba(247, 234, 216, .6);
      --gold: #e8b04b;
      --coral: #f2795c;
      --rose: #e05c74;
      --hairline: rgba(247, 234, 216, .28);
    }

    body {
      font-family: "Jost", sans-serif;
      font-weight: 300;
      background:
        linear-gradient(to bottom,
          var(--dusk-top) 0%,
          var(--dusk-mid) 42%,
          var(--dusk-low) 74%,
          var(--horizon) 115%);
      color: var(--cream);
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    /* ── lebendiger Abendhimmel ─────────────────── */
    .sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .sky .glow {
      position: absolute;
      left: 50%; bottom: -22%;
      width: 130vw; height: 60vh;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at center,
        rgba(240, 158, 66, .5), rgba(226, 112, 60, .22) 45%, transparent 70%);
      filter: blur(30px);
      animation: breathe 11s ease-in-out infinite;
    }
    .sky .cloud {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .35;
    }
    .sky .cloud.c1 {
      width: 55vw; height: 22vh;
      top: 26%; left: -12%;
      background: radial-gradient(ellipse, rgba(240, 170, 90, .5), transparent 70%);
      animation: drift1 46s ease-in-out infinite alternate;
    }
    .sky .cloud.c2 {
      width: 42vw; height: 18vh;
      top: 14%; right: -10%;
      background: radial-gradient(ellipse, rgba(224, 92, 116, .4), transparent 70%);
      animation: drift2 58s ease-in-out infinite alternate;
    }
    @keyframes breathe {
      0%, 100% { opacity: .75; transform: translateX(-50%) scaleY(1); }
      50%      { opacity: 1;   transform: translateX(-50%) scaleY(1.12); }
    }
    @keyframes drift1 {
      from { transform: translateX(0) translateY(0); }
      to   { transform: translateX(16vw) translateY(2vh); }
    }
    @keyframes drift2 {
      from { transform: translateX(0) translateY(0); }
      to   { transform: translateX(-14vw) translateY(3vh); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sky .glow, .sky .cloud { animation: none; }
    }

    main {
      position: relative; z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(2rem, 6vw, 5rem);
      animation: reveal 1.6s ease-out both;
    }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
    }

    .kicker {
      font-size: clamp(.7rem, 1.6vw, .8rem);
      letter-spacing: .55em;
      text-indent: .55em; /* optically center tracked caps */
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: clamp(1.2rem, 3vw, 2rem);
    }

    h1 {
      font-family: "Cormorant Garamond", serif;
      font-weight: 700;
      font-size: clamp(3.2rem, 12vw, 8.5rem);
      line-height: 1;
      letter-spacing: .01em;
      color: var(--cream);
      text-shadow: 0 0 60px rgba(232, 148, 58, .35);
    }
    h1 em {
      font-style: italic;
      font-weight: 500;
      background: linear-gradient(100deg, var(--gold) 5%, var(--coral) 45%, var(--rose) 90%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .title-wrap {
      position: relative;
      display: inline-block;
    }

    .stamp {
      position: absolute;
      top: -.55em;
      right: -1.6em;
      font-size: clamp(.58rem, 1.5vw, .78rem);
      font-weight: 400;
      letter-spacing: .32em;
      text-indent: .32em;
      text-transform: uppercase;
      color: var(--gold);
      border: 1.5px solid var(--gold);
      outline: 1px solid rgba(232, 176, 75, .45);
      outline-offset: 3px;
      border-radius: 2px;
      padding: .55em .7em .55em .7em;
      transform: rotate(9deg);
      opacity: .92;
      animation: stamp-in .5s cubic-bezier(.2, 1.6, .4, 1) .9s both;
    }
    @keyframes stamp-in {
      from { opacity: 0; transform: rotate(9deg) scale(1.7); }
      to   { opacity: .92; transform: rotate(9deg) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .stamp { animation: none; }
    }

    .rule {
      width: min(340px, 60vw);
      height: 1px;
      background: var(--hairline);
      margin: clamp(1.6rem, 4vw, 2.6rem) auto;
      position: relative;
    }
    .rule::after {
      content: "◆";
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -52%);
      font-size: .5rem;
      color: var(--gold);
      background: transparent;
      padding: 0 .9em;
    }

    .date {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(1.6rem, 4.5vw, 2.6rem);
      font-weight: 500;
      font-variant-numeric: lining-nums;
    }
    .date .sep { color: var(--terracotta); padding: 0 .35em; font-weight: 400; }

    .meta {
      margin-top: .9rem;
      font-size: clamp(.75rem, 1.8vw, .85rem);
      letter-spacing: .4em;
      text-indent: .4em;
      text-transform: uppercase;
      color: var(--cream-soft);
    }
    .meta b { font-weight: 400; color: var(--cream); }

    .offerings {
      margin-top: clamp(2.2rem, 5vw, 3.4rem);
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: clamp(1.4rem, 4vw, 3rem);
    }
    .offering {
      display: flex;
      flex-direction: column;
      gap: .3rem;
    }
    .offering .what {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: clamp(1.3rem, 3.4vw, 1.9rem);
      color: var(--gold);
    }
    .offering .who {
      font-size: clamp(.7rem, 1.7vw, .8rem);
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--cream-soft);
    }
    .award {
      margin-top: .35rem;
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: clamp(.85rem, 2vw, 1.05rem);
      color: var(--coral);
      text-decoration: none;
      border-bottom: 1px solid rgba(242, 121, 92, .35);
      transition: border-color .25s ease, color .25s ease;
    }
    .award:hover { color: var(--gold); border-color: var(--gold); }
    .divider {
      width: 1px;
      background: var(--hairline);
    }

    .support {
      margin-top: clamp(2.4rem, 5vw, 3.6rem);
      font-size: clamp(.65rem, 1.5vw, .72rem);
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--cream-soft);
      opacity: .8;
    }

    /* ── classy button ──────────────────────────── */
    .btn {
      display: inline-block;
      margin-top: 2rem;
      font-size: clamp(.68rem, 1.6vw, .78rem);
      letter-spacing: .32em;
      text-indent: .32em;
      text-transform: uppercase;
      color: var(--cream);
      text-decoration: none;
      padding: 1em 2.2em;
      border: 1px solid var(--hairline);
      border-radius: 2px;
      background: rgba(247, 234, 216, .04);
      transition: border-color .3s ease, color .3s ease, background .3s ease, transform .3s ease;
    }
    .btn:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(232, 176, 75, .06);
      transform: translateY(-2px);
    }


    footer {
      position: relative; z-index: 1;
      padding: 1.6rem;
      text-align: center;
      font-size: .68rem;
      letter-spacing: .45em;
      text-indent: .45em;
      text-transform: uppercase;
      color: var(--cream-soft);
      opacity: .75;
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="glow"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
  </div>
  <main>
    <p class="kicker">Sonne · Sounds · Spritzer</p>
    <div class="title-wrap">
      <h1>Sun<em>Downer</em></h1>
      <span class="stamp" aria-label="Ort: Am Tabor">Am Tabor</span>
    </div>
    <div class="rule" aria-hidden="true"></div>
    <p class="date">25<span class="sep">·</span>09<span class="sep">·</span>2026</p>
    <p class="meta">Neusiedl am See &nbsp;·&nbsp; Live &amp; DJ</p>

    <div class="offerings">
      <div class="offering">
        <span class="what">Food</span>
        <span class="who">von Joe's Pub</span>
        <a class="award" href="https://www.bvz.at/neusiedl/falstaff-voting-das-ist-die-beliebteste-pizzeria-des-burgenlands-480867248" target="_blank" rel="noopener">★ Burgenlands beste Pizza</a>
      </div>
      <div class="divider" aria-hidden="true"></div>
      <div class="offering">
        <span class="what">Spritzer</span>
        <span class="who">von Weingut Königshofer</span>
      </div>
    </div>

    <p class="support">Unterstützt von der Stadtgemeinde Neusiedl am See</p>
    <a class="btn" href="/partner">Sponsoren &amp; Partner</a>
  </main>


  <footer>SunDowner · Am Tabor · 2026</footer>
</body>
</html>
