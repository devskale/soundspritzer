<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soundspritzer — 25.09.2026 · Neusiedl am See</title>
  <meta name="description" content="Soundspritzer — Live-Musik & DJ. 25. September 2026, Neusiedl am See.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --paper: #f6efe4;
      --paper-warm: #efe4d3;
      --ink: #33231a;
      --ink-soft: rgba(51, 35, 26, .62);
      --terracotta: #b4552d;
      --gold: #a8823f;
      --hairline: rgba(51, 35, 26, .25);
    }

    body {
      font-family: "Jost", sans-serif;
      font-weight: 300;
      background:
        radial-gradient(ellipse at 50% -20%, var(--paper-warm), transparent 60%),
        var(--paper);
      color: var(--ink);
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(2rem, 6vw, 5rem);
      animation: reveal 1.6s ease-out both;
    }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) { main { animation: none; } }

    .kicker {
      font-size: clamp(.7rem, 1.6vw, .8rem);
      letter-spacing: .55em;
      text-indent: .55em; /* optically center tracked caps */
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: clamp(1.2rem, 3vw, 2rem);
    }

    h1 {
      font-family: "Cormorant Garamond", serif;
      font-weight: 500;
      font-size: clamp(3.2rem, 12vw, 8.5rem);
      line-height: 1;
      letter-spacing: .01em;
    }
    h1 em {
      font-style: italic;
      font-weight: 400;
      color: var(--terracotta);
    }

    .rule {
      width: min(340px, 60vw);
      height: 1px;
      background: var(--hairline);
      margin: clamp(1.6rem, 4vw, 2.6rem) auto;
      position: relative;
    }
    .rule::after {
      content: "◆";
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -52%);
      font-size: .5rem;
      color: var(--gold);
      background: var(--paper);
      padding: 0 .9em;
    }

    .date {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(1.6rem, 4.5vw, 2.6rem);
      font-weight: 500;
      font-variant-numeric: lining-nums;
    }
    .date .sep { color: var(--terracotta); padding: 0 .35em; font-weight: 400; }

    .meta {
      margin-top: .9rem;
      font-size: clamp(.75rem, 1.8vw, .85rem);
      letter-spacing: .4em;
      text-indent: .4em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .meta b { font-weight: 400; color: var(--ink); }

    footer {
      padding: 1.6rem;
      text-align: center;
      font-size: .68rem;
      letter-spacing: .45em;
      text-indent: .45em;
      text-transform: uppercase;
      color: var(--ink-soft);
      opacity: .75;
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Ein Abend · Ein Ort · Musik</p>
    <h1>Sounds<em>pritzer</em></h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="date">25<span class="sep">·</span>09<span class="sep">·</span>2026</p>
    <p class="meta">Neusiedl am See &nbsp;—&nbsp; <b>Live &amp; DJ</b></p>
  </main>
  <footer>Soundspritzer · 2026</footer>
</body>
</html>
