<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soundspritzer — 25.09.2026 · Neusiedl am See</title>
  <meta name="description" content="Soundspritzer — Live-Musik & DJ. 25. September 2026, Neusiedl am See.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --dusk-top: #221528;
      --dusk-mid: #4d2334;
      --dusk-low: #8f3d28;
      --horizon: #e08a3c;
      --cream: #f7ead8;
      --cream-soft: rgba(247, 234, 216, .6);
      --gold: #e8b04b;
      --coral: #f2795c;
      --rose: #e05c74;
      --hairline: rgba(247, 234, 216, .28);
    }

    body {
      font-family: "Jost", sans-serif;
      font-weight: 300;
      background:
        radial-gradient(ellipse 120% 55% at 50% 108%, rgba(232, 148, 58, .55), transparent 60%),
        linear-gradient(to bottom,
          var(--dusk-top) 0%,
          var(--dusk-mid) 42%,
          var(--dusk-low) 74%,
          var(--horizon) 115%);
      color: var(--cream);
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(2rem, 6vw, 5rem);
      animation: reveal 1.6s ease-out both;
    }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) { main { animation: none; } }

    .kicker {
      font-size: clamp(.7rem, 1.6vw, .8rem);
      letter-spacing: .55em;
      text-indent: .55em; /* optically center tracked caps */
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: clamp(1.2rem, 3vw, 2rem);
    }

    h1 {
      font-family: "Cormorant Garamond", serif;
      font-weight: 500;
      font-size: clamp(3.2rem, 12vw, 8.5rem);
      line-height: 1;
      letter-spacing: .01em;
      color: var(--cream);
      text-shadow: 0 0 60px rgba(232, 148, 58, .35);
    }
    h1 em {
      font-style: italic;
      font-weight: 400;
      background: linear-gradient(100deg, var(--gold) 5%, var(--coral) 45%, var(--rose) 90%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .rule {
      width: min(340px, 60vw);
      height: 1px;
      background: var(--hairline);
      margin: clamp(1.6rem, 4vw, 2.6rem) auto;
      position: relative;
    }
    .rule::after {
      content: "◆";
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -52%);
      font-size: .5rem;
      color: var(--gold);
      background: transparent;
      padding: 0 .9em;
    }

    .date {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(1.6rem, 4.5vw, 2.6rem);
      font-weight: 500;
      font-variant-numeric: lining-nums;
    }
    .date .sep { color: var(--terracotta); padding: 0 .35em; font-weight: 400; }

    .meta {
      margin-top: .9rem;
      font-size: clamp(.75rem, 1.8vw, .85rem);
      letter-spacing: .4em;
      text-indent: .4em;
      text-transform: uppercase;
      color: var(--cream-soft);
    }
    .meta b { font-weight: 400; color: var(--cream); }

    .offerings {
      margin-top: clamp(2.2rem, 5vw, 3.4rem);
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: clamp(1.4rem, 4vw, 3rem);
    }
    .offering {
      display: flex;
      flex-direction: column;
      gap: .3rem;
    }
    .offering .what {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: clamp(1.3rem, 3.4vw, 1.9rem);
      color: var(--gold);
    }
    .offering .who {
      font-size: clamp(.7rem, 1.7vw, .8rem);
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--cream-soft);
    }
    .divider {
      width: 1px;
      background: var(--hairline);
    }

    .support {
      margin-top: clamp(2.4rem, 5vw, 3.6rem);
      font-size: clamp(.65rem, 1.5vw, .72rem);
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--cream-soft);
      opacity: .8;
    }

    footer {
      padding: 1.6rem;
      text-align: center;
      font-size: .68rem;
      letter-spacing: .45em;
      text-indent: .45em;
      text-transform: uppercase;
      color: var(--cream-soft);
      opacity: .75;
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Sonne · Sounds · Spritzer</p>
    <h1>Sounds<em>pritzer</em></h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="date">25<span class="sep">·</span>09<span class="sep">·</span>2026</p>
    <p class="meta"><b>Am Tabor</b> &nbsp;·&nbsp; Neusiedl am See &nbsp;·&nbsp; Live &amp; DJ</p>

    <div class="offerings">
      <div class="offering">
        <span class="what">Food</span>
        <span class="who">von Joe's Pub</span>
      </div>
      <div class="divider" aria-hidden="true"></div>
      <div class="offering">
        <span class="what">Spritzer</span>
        <span class="who">von Weingut Königshofer</span>
      </div>
    </div>

    <p class="support">Unterstützt von der Stadtgemeinde Neusiedl am See</p>
  </main>
  <footer>Soundspritzer · Am Tabor · 2026</footer>
</body>
</html>
