<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540">
  <!-- Reine Schallplatte (nach Lucide/Phosphor "disc"-Anatomie):
       Rim → viele Rillen → Label → Center-Loch. Nichts sonst.
       Stil: weiße Sticker-Fläche, Tinten-Kontur, Gold-Label,
       leichter Wobble für den Handstrich-Look der Seite. -->
  <defs>
    <radialGradient id="label" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#f3dd9a"/>
      <stop offset="55%" stop-color="#e2ac4e"/>
      <stop offset="100%" stop-color="#c98d2e"/>
    </radialGradient>
    <filter id="wobble" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
  </defs>

  <g filter="url(#wobble)">
    <!-- Rim: weiße Platte mit Tinten-Außenkontur -->
    <circle cx="270" cy="270" r="250" fill="#fffdf7" stroke="#2b1a20" stroke-width="13"/>

    <!-- Rillen: viele konzentrische Ringe, unterschiedliche Gewichte -->
    <circle cx="270" cy="270" r="231" fill="none" stroke="#2b1a20" stroke-width="2.5" opacity=".5"/>
    <circle cx="270" cy="270" r="217" fill="none" stroke="#2b1a20" stroke-width="4"   opacity=".85"/>
    <circle cx="270" cy="270" r="204" fill="none" stroke="#2b1a20" stroke-width="2"   opacity=".45"/>
    <circle cx="270" cy="270" r="192" fill="none" stroke="#2b1a20" stroke-width="3.5" opacity=".8"/>
    <circle cx="270" cy="270" r="181" fill="none" stroke="#2b1a20" stroke-width="2"   opacity=".4"/>
    <circle cx="270" cy="270" r="170" fill="none" stroke="#2b1a20" stroke-width="3.5" opacity=".75"/>
    <circle cx="270" cy="270" r="160" fill="none" stroke="#2b1a20" stroke-width="2"   opacity=".4"/>
    <circle cx="270" cy="270" r="151" fill="none" stroke="#2b1a20" stroke-width="3"   opacity=".7"/>
    <circle cx="270" cy="270" r="143" fill="none" stroke="#2b1a20" stroke-width="2"   opacity=".35"/>

    <!-- Lead-out-Steg vor dem Label -->
    <circle cx="270" cy="270" r="128" fill="none" stroke="#2b1a20" stroke-width="5" opacity=".85"/>

    <!-- Goldenes Label (plain, keine Zeichnung) -->
    <circle cx="270" cy="270" r="96" fill="url(#label)" stroke="#2b1a20" stroke-width="9"/>

    <!-- Center-Loch -->
    <circle cx="270" cy="270" r="15" fill="#fffdf7" stroke="#2b1a20" stroke-width="7"/>
  </g>
</svg>
